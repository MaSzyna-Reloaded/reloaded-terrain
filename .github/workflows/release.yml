name: release

# reloaded-terrain.zip - addons/terrain_3d (Terrain3D patched, built double precision for Linux and
# Windows) and addons/reloaded_terrain (WorldTerrainStreamer) - built and published: main's newest as
# the one prerelease MAIN_RELEASE, replaced on every push to main; a pushed tag (YYMMDDHHMM) as a
# release of its own, named by the tag, the latest. Terrain3D's libraries are built again only when
# its sources, the patches or the godot-cpp they are built against change (cached); the double
# precision Godot dumping the API is libmaszyna's release godot-<version>-double.
on:
  push:
    branches:
      - main
    tags:
      - '**'
      # made by the CI itself (a tag it makes starts no workflow anyway)
      - '!reloaded-terrain-main'
  workflow_dispatch:

env:
  MAIN_RELEASE: reloaded-terrain-main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Terrain3D's sources
        id: sources
        run: |
          echo "key=terrain3d-$(git rev-parse HEAD:vendor/terrain3d)-$(sed -n 's/^GODOT_CPP_COMMIT:=//p' Makefile)-${{ hashFiles('patches/*.patch') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: cache
        with:
          path: vendor/terrain3d/project/addons/terrain_3d/bin
          key: ${{ steps.sources.outputs.key }}

      - name: Fetch the double precision Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/godot-double" \
            "https://github.com/MaSzyna-Reloaded/libmaszyna/releases/download/godot-$(make -s godot-version)-double/godot.linuxbsd.editor.double.x86_64"
          chmod +x "$HOME/.local/bin/godot-double"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install scons and MinGW
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pipx install scons
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Build Terrain3D
        if: steps.cache.outputs.cache-hit != 'true'
        run: make build build-windows GODOT=godot-double

      - name: Pack reloaded-terrain.zip
        run: make dist

      - name: Publish the tag's release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/reloaded-terrain.zip --verify-tag --title "$GITHUB_REF_NAME" --latest \
            --notes "addons/terrain_3d and addons/reloaded_terrain of $GITHUB_REF_NAME: unzip into a project."

      - name: Publish main's release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$MAIN_RELEASE" --cleanup-tag --yes || true
          gh release create "$MAIN_RELEASE" dist/reloaded-terrain.zip --target "$GITHUB_SHA" --prerelease \
            --title "$MAIN_RELEASE" --notes "addons/terrain_3d and addons/reloaded_terrain of main at ${GITHUB_SHA::7}: unzip into a project."
